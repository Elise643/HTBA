<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <link rel="stylesheet" href="styles.css">
  <script src="loadPartials.js" defer></script>
  <script src="firebase.js" defer></script>
  <script src="signup.js" defer></script>
<script src="locationswap.js" defer></script>
</head>
<body>
  <div id="header-container"></div>

  <main>
    <h2>Sign Up</h2>
    <div class="signUpDiv">
    <h4>Account Type</h4>
    <input type="radio" name="accountType" value="student" id="radioStudent" hidden="">
    <label for="radioStudent">
                <span>
            Student
        </span>
    </label>
    <input type="radio" name="accountType" value="staff" id="radioStaff" hidden="">
    <label for="radioStaff">
        <span>
            Staff
        </span>
    </label>
    <input type="radio" name="accountType" value="visitor" id="radioVisitor" hidden="">
    <label for="radioVisitor">        <span>
            Visitor
        </span></label>
<hr>
    <form id="signupForm" hidden>
    <p id="signup-message" hidden></p>
  </form>
  </div>

  </main>

  <div id="footer-container"></div>
</body>
</html>
